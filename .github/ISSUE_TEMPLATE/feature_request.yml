name: Feature request
description: Something the SDK should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to get done?
      description: Describe the job, not the solution. An example from your business helps.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
